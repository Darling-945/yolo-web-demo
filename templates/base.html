<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">

    <title>YOLO 目标检测</title>
  </head>
  <body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-eye"></i>
          <span>YOLO Detection</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">
                <i class="fas fa-home me-1"></i>
                <span class="d-none d-md-inline">首页</span>
              </a>
            </li>
            <!-- Camera features disabled, uncomment to enable
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'camera' %}active{% endif %}" href="/camera">
                <i class="fas fa-video me-1"></i>
                <span class="d-none d-md-inline">摄像头</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'camera_debug' %}active{% endif %}" href="/camera/debug" title="Camera Debug">
                <i class="fas fa-stethoscope me-1"></i>
                <span class="d-none d-md-inline">调试</span>
              </a>
            </li>
            -->
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="/about">
                <i class="fas fa-info-circle me-1"></i>
                <span class="d-none d-md-inline">关于</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Flash Messages -->
    <div class="flash-messages position-fixed top-0 start-50 translate-middle-x" style="z-index: 9999; margin-top: 80px;">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
              <div class="d-flex align-items-center">
                <i class="fas {% if category == 'error' %}fa-exclamation-circle text-danger{% elif category == 'success' %}fa-check-circle text-success{% elif category == 'warning' %}fa-exclamation-triangle text-warning{% else %}fa-info-circle{% endif %} me-2"></i>
                <div class="flex-grow-1">{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
              </div>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <div class="container" style="margin-top: 100px; max-width: 1200px;">
      {% block content %}{% endblock %}
    </div>


    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- Multi-file upload JavaScript -->
    <script src="{{ url_for('static', filename='js/multi-file-upload.js') }}"></script>

    <script>
        // Toast Notification System
        function showToast(type, message, level = 'info') {
            const container = document.createElement('div');
            container.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 9999;
            `;
            document.body.appendChild(container);

            const toast = document.createElement('div');
            toast.className = `custom-toast ${level}`;

            const icons = {
                'success': 'fa-check-circle',
                'error': 'fa-exclamation-circle',
                'warning': 'fa-exclamation-triangle',
                'info': 'fa-info-circle'
            };

            const icon = icons[type] || icons['info'];

            toast.innerHTML = `
                <i class="fas ${icon}"></i>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.parentElement.remove()" title="关闭">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            const autoRemoveTimer = setTimeout(() => {
                if (container.parentElement) {
                    toast.style.animation = 'slideOut 0.25s ease-out forwards';
                    setTimeout(() => {
                        container.remove();
                    }, 250);
                }
            }, 2000);

            toast.querySelector('.toast-close').addEventListener('click', () => {
                clearTimeout(autoRemoveTimer);
            });
        }
      </script>
  </body>
</html>
