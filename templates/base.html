<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css?v=5.3.3" rel="stylesheet" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <title>YOLO Object Detection</title>
  </head>
  <body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-eye me-2"></i>
          <span>YOLO 检测</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">
                <i class="fas fa-home me-1"></i>
                <span class="d-none d-md-inline">首页</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'camera' %}active{% endif %}" href="/camera">
                <i class="fas fa-video me-1"></i>
                <span class="d-none d-md-inline">摄像头检测</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="/about">
                <i class="fas fa-info-circle me-1"></i>
                <span class="d-none d-md-inline">关于</span>
              </a>
            </li>
            <li class="nav-item ms-2">
              <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换深色/浅色模式">
                <i class="fas fa-moon"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Flash消息容器 -->
    <div class="flash-messages position-fixed top-0 start-50 translate-middle-x" style="z-index: 9999; margin-top: 80px;">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show shadow-lg" role="alert">
              <div class="d-flex align-items-center">
                <i class="fas {% if category == 'error' %}fa-exclamation-circle text-danger{% elif category == 'success' %}fa-check-circle text-success{% elif category == 'warning' %}fa-exclamation-triangle text-warning{% else %}fa-info-circle text-info{% endif %} me-2"></i>
                <div class="flex-grow-1">{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <div class="container" style="margin-top: 100px;">
      {% block content %}{% endblock %}
    </div>


    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js?v=5.3.3" crossorigin="anonymous"></script>

    <!-- Multi-file upload JavaScript -->
    <script src="{{ url_for('static', filename='js/multi-file-upload.js') }}"></script>

    <script>
        // Toast 通知系统
        function showToast(type, message, level = 'info') {
            // 创建临时容器
            const container = document.createElement('div');
            container.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 9999;
            `;
            document.body.appendChild(container);

            const toast = document.createElement('div');
            toast.className = `custom-toast ${level}`;

            const icons = {
                'success': 'fa-check-circle',
                'error': 'fa-exclamation-circle',
                'warning': 'fa-exclamation-triangle',
                'info': 'fa-info-circle'
            };

            const icon = icons[type] || icons['info'];

            toast.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            // 自动移除
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    document.body.removeChild(container);
                }, 300);
            }, 3000);
        }

        // 深色模式切换功能
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const icon = themeToggle?.querySelector('i');

            // 从localStorage读取主题偏好
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            // 初始化主题
            function initTheme() {
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.body.classList.add('dark-mode');
                    if (icon) {
                        icon.className = 'fas fa-sun';
                    }
                }
            }

            // 切换主题
            function toggleTheme() {
                const isDark = document.body.classList.toggle('dark-mode');

                // 更新图标
                if (icon) {
                    icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                }

                // 保存到localStorage
                localStorage.setItem('theme', isDark ? 'dark' : 'light');

                // 显示提示
                showToast('info', isDark ? '已切换到深色模式' : '已切换到浅色模式', 'info');

                // 添加切换动画
                document.body.style.transition = 'background 0.3s ease, color 0.3s ease';
                setTimeout(() => {
                    document.body.style.transition = '';
                }, 300);
            }

            // 初始化
            initTheme();

            // 绑定点击事件
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }

            // 监听系统主题变化
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    initTheme();
                }
            });
        })();
      </script>
  </body>
</html>
